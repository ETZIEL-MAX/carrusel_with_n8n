services:
  carrusel:
    build: .
    container_name: carrusel
    ports:
      - "8080:8080"
    environment:
      LOCAL_STORAGE: "0"
      IMAGE_STORAGE: "local"
      REDIS_URL: "redis://redis:6379"
      PORT: "8080"
      ADMIN_PASSWORD_HASH: "$$argon2id$$v=19$$m=19456,t=2,p=1$$Jh0XC1lAaTMwmkroh0rIZA$$ZbFZ7LNc6QJqk/hbVtOhv1V7rsORlWFOh7OOPKnubTk"
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en .env}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?falta WEBHOOK_SECRET en .env}"
    volumes:
      - ./.data:/app/.data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: carrusel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data: