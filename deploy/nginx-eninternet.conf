# /etc/nginx/conf.d/zz-eninternet.conf — dominio principal del carrusel.
# Igual que el de carrusel.etziel.com: puede ir detrás del proxy de Cloudflare
# (la IP real llega en CF-Connecting-IP, ver carrusel-cloudflare.inc).
# www.eninternet.tv redirige al dominio sin www.

server {
    listen 80;
    server_name eninternet.tv www.eninternet.tv;

    include /etc/nginx/carrusel-cloudflare.inc;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        # Cloudflare en modo "Flexible" llega por HTTP con X-Forwarded-Proto: https.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://eninternet.tv$request_uri;
        }
        include /etc/nginx/carrusel-proxy.inc;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name www.eninternet.tv;

    ssl_certificate /etc/letsencrypt/live/eninternet.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eninternet.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eninternet.tv$request_uri;
}

server {
    listen 443 ssl;
    server_name eninternet.tv;

    ssl_certificate /etc/letsencrypt/live/eninternet.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eninternet.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/carrusel-cloudflare.inc;

    client_max_body_size 25m;

    # Subida de imagen desde el panel: hasta 25 MB, sin buffering (la app escribe a disco).
    location = /api/images-upload {
        client_max_body_size 26m;
        proxy_request_buffering off;
        include /etc/nginx/carrusel-proxy.inc;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        include /etc/nginx/carrusel-proxy.inc;
        proxy_read_timeout 60s;
    }
}
