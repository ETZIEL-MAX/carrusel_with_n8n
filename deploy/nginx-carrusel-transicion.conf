# /etc/nginx/conf.d/zz-carrusel.conf — SOLO para el cambio de dominio (fase 2, la instala
# install-nginx-eninternet.sh). Hasta entonces se usa nginx-carrusel.conf.
#
# carrusel.etziel.com pasa a ser el dominio ANTERIOR (el principal será eninternet.tv, ver
# nginx-eninternet.conf). Durante la transición:
# - /api/ y /uploads/ siguen funcionando aquí, para los flujos de n8n que aún no se
#   actualizan y las TVs que ya tienen abierto el carrusel.
# - Todo lo demás (panel, /carrusel/USERx, páginas) redirige a eninternet.tv. Una TV
#   abierta se pasa sola al dominio nuevo la próxima vez que se recarga (por ejemplo,
#   con cada deploy), y ahí cuenta como pantalla nueva.
# Pasa por el proxy de Cloudflare (nube naranja): la IP real viene en CF-Connecting-IP.

server {
    listen 80;
    server_name carrusel.etziel.com;

    include /etc/nginx/carrusel-cloudflare.inc;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://eninternet.tv$request_uri;
    }

    # Cloudflare en modo "Flexible" llega por HTTP con X-Forwarded-Proto: https.
    location ~ ^/(api|uploads)/ {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        include /etc/nginx/carrusel-proxy.inc;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name carrusel.etziel.com;

    ssl_certificate /etc/letsencrypt/live/carrusel.etziel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carrusel.etziel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/carrusel-cloudflare.inc;

    client_max_body_size 25m;

    location / {
        return 301 https://eninternet.tv$request_uri;
    }

    location ~ ^/(api|uploads)/ {
        include /etc/nginx/carrusel-proxy.inc;
        proxy_read_timeout 60s;
    }
}
