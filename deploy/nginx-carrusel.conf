# /etc/nginx/conf.d/zz-carrusel.conf
# Nombre "zz-" a propósito: se carga DESPUÉS de virgo.conf, así plasticosvirgo
# sigue siendo el servidor por defecto para peticiones sin Host conocido.
#
# carrusel.etziel.com pasa por el proxy de Cloudflare (nube naranja):
# - La IP real del cliente viene en CF-Connecting-IP (solo se confía en ella
#   si la petición llega desde un rango de Cloudflare).
# - Si Cloudflare está en modo SSL "Flexible" llega por HTTP con
#   X-Forwarded-Proto: https; en ese caso se sirve la app en vez de redirigir
#   (evita bucle de redirecciones).

server {
    listen 80;
    server_name carrusel.etziel.com;

    include /etc/nginx/carrusel-cloudflare.inc;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name carrusel.etziel.com;

    ssl_certificate /etc/letsencrypt/live/carrusel.etziel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carrusel.etziel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/carrusel-cloudflare.inc;

    # Límite general de cuerpo (las subidas grandes tienen su propia ruta abajo).
    client_max_body_size 25m;

    # Subida de imagen desde el panel: hasta 25 MB (MANUAL_UPLOAD_MAX_BYTES). Sin buffering:
    # la app la escribe a disco mientras llega.
    location = /api/images-upload {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Subida de video desde el panel: hasta 50 MB (VIDEO_MAX_BYTES) + margen. Sin
    # buffering: nginx no guarda el archivo antes de pasarlo, la app lo escribe a disco
    # mientras llega.
    location = /api/video-upload {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
