# Versión temporal solo HTTP de eninternet.tv: deja que certbot valide el dominio antes
# de que exista el certificado. Luego se reemplaza por nginx-eninternet.conf.

server {
    listen 80;
    server_name eninternet.tv www.eninternet.tv;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
