# Versión temporal solo HTTP: permite que certbot valide el dominio
# antes de que exista el certificado. Luego se reemplaza por nginx-carrusel.conf.

server {
    listen 80;
    server_name carrusel.etziel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
